<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HereForYou - Always Here For You</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a1b9a">
<link rel="icon" href="icons/icon-192x192.png">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<style>
    * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #fdf7ff; color: #333; text-align: center; }
  header { background: #6a1b9a; color: white; padding: 30px 20px; border-radius: 0 0 30px 30px; }
  header h1 { font-size: 42px; margin: 0; }
  header p { font-size: 22px; opacity: 0.9; }
  .lang { margin-top: 15px; }
  .lang button { font-size: 20px; padding: 10px 20px; border-radius: 20px; border: none; background: white; color: #6a1b9a; font-weight: bold; cursor: pointer; }
  .container { padding: 20px; max-width: 600px; margin: auto; }
  .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
  .card h2 { font-size: 28px; color: #6a1b9a; margin: 0 0 10px; }
  .card p { font-size: 21px; line-height: 1.6; }
  .big-btn { display: block; width: 100%; font-size: 26px; padding: 18px; margin: 12px 0; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
  .btn-purple { background: #6a1b9a; color: white; }
  .btn-light { background: #f3e5f5; color: #6a1b9a; }
  .btn-green { background: #2e7d32; color: white; }
  input { width: 100%; font-size: 22px; padding: 15px; border-radius: 15px; border: 2px solid #ddd; text-align: center; }
  #chat { text-align: left; min-height: 100px; font-size: 21px; line-height: 1.6; }
  .msg { background: #f3e5f5; padding: 12px 15px; border-radius: 15px; margin: 10px 0; text-align: left; }
  footer { padding: 20px; color: #888; font-size: 16px; }
</style>
</head>
<body>

<header>
  <h1 id="title">HereForYou 💜</h1>
  <p id="subtitle">A warm, simple and safe companion - every day</p>
  <div class="lang">
    <button onclick="setLang('en')">English</button>
    <button onclick="setLang('he')">עברית</button>
  </div>
</header>

<div class="container">
  <div class="card">
    <h2 id="helloTitle">Hello, how are you feeling today?</h2>
    <p id="helloText">I am here for you. You can talk, ask, or just say hello.</p>
    <div id="chat"><div class="msg">Hello! I am here for you. How was your day today? 😊</div></div>
    <input id="input" placeholder="Type here..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button class="big-btn btn-purple" onclick="sendMsg()">Send 💬</button>
  </div>

  <div class="card">
    <h2 id="helpTitle">What can we do?</h2>
    <button class="big-btn btn-light" onclick="quick('Tell me a nice story')">📖 Tell me a story</button>
    <button class="big-btn btn-light" onclick="quick('Remind me to drink water')">💧 Remind me to drink water</button>
    <button class="big-btn btn-light" onclick="quick('What is the weather today?')">🌤️ Weather</button>
    <button class="big-btn btn-green" onclick="alert('If you feel unwell, please call your family or emergency services (911)')">🆘 I need help</button>
  </div>
</div>

<footer>HereForYou - Made with ❤️ for you</footer>

<script>
function sendMsg(){
  let inp = document.getElementById('input');
  let txt = inp.value.trim();
  if(!txt) return;
  let chat = document.getElementById('chat');
  chat.innerHTML += '<div class="msg"><b>You:</b> '+txt+'</div>';
  inp.value = '';
  setTimeout(()=>{
    chat.innerHTML += '<div class="msg">Thank you for sharing. I am always here for you, tell me a little more 💜</div>';
    chat.scrollIntoView({behavior:"smooth"});
  }, 800);
}
function quick(t){
  document.getElementById('input').value = t;
  sendMsg();
}
function setLang(l){
  if(l==='en'){
    document.documentElement.dir='ltr';
    document.documentElement.lang='en';
    document.getElementById('title').innerText='HereForYou 💜';
    document.getElementById('subtitle').innerText='A warm, simple and safe companion - every day';
    document.getElementById('helloTitle').innerText='Hello, how are you feeling today?';
    document.getElementById('helloText').innerText='I am here for you. You can talk, ask, or just say hello.';
    document.getElementById('helpTitle').innerText='What can we do?';
    document.getElementById('input').placeholder='Type here...';
  } else {
    document.documentElement.dir='rtl';
    document.documentElement.lang='he';
    document.getElementById('title').innerText='כאן בשבילך 💜';
    document.getElementById('subtitle').innerText='חברה חמה, פשוטה ובטוחה - לכל יום';
    document.getElementById('helloTitle').innerText='שלום, איך אתה מרגיש היום?';
    document.getElementById('helloText').innerText='אני כאן בשבילך. אפשר לדבר, לשאול, או סתם להגיד שלום.';
    document.getElementById('helpTitle').innerText='מה אפשר לעשות?';
    document.getElementById('input').placeholder='כתוב כאן...';
  }
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
