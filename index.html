<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HereForYou</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EFEAE2;color:#111;font-family:system-ui,-apple-system,sans-serif;padding-bottom:180px}
/* ===== TOPBAR - META STYLE ===== */
.topbar{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #E5E5E5;position:sticky;top:0;z-index:20;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0082FB,#00A884);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;box-shadow:0 2px 6px rgba(0,130,251,.3)}
.top-info{flex:1}.top-info h1{font-size:18px;font-weight:700;color:#111;display:flex;align-items:center;gap:6px}
.top-info h1 .verified{width:18px;height:18px;background:#0082FB;color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.top-info p{font-size:12.5px;color:#00A884;font-weight:600}
.top-actions{display:flex;gap:6px}
.top-actions button{width:38px;height:38px;border-radius:50%;border:none;background:#F0F2F5;font-size:18px;cursor:pointer}
/* ===== MEMORY CARD - META CARD ===== */
.mem-card{background:#fff;border-radius:16px;margin:14px 16px 0;padding:14px 16px;font-size:13.5px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #F0F2F5}
.mem-card b{font-size:14px;color:#111}
.mem-card .meta-pill{display:inline-block;background:#E7F3FF;color:#0082FB;font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;margin-left:4px}
/* ===== CHAT ===== */
#chat-box{display:flex;flex-direction:column;gap:10px;padding:16px}
.msg-row{display:flex;max-width:85%;align-items:flex-end;gap:6px}.msg-row.mine{align-self:flex-end;flex-direction:row-reverse}.msg-row.bot-row{align-self:flex-start}
.msg-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0082FB,#00A884);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.bubble{padding:11px 14px;border-radius:18px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bubble.user{background:#D9FDD3;color:#111;border-bottom-right-radius:4px}
.bubble.bot{background:#fff;color:#111;border-bottom-left-radius:4px}
.msg-time{font-size:10.5px;color:#8696A0;margin-top:4px;text-align:right}
.msg-row.mine .msg-time{text-align:right}
.typing-dots{display:flex;gap:5px;padding:14px 16px;background:#fff;border-radius:18px;width:70px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.typing-dots span{width:8px;height:8px;background:#00A884;border-radius:50%;animation:blink 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
/* ===== INPUT - WHATSAPP STYLE ===== */
#input-area{position:fixed;bottom:0;left:0;right:0;background:#F0F2F5;padding:10px 12px 16px;border-top:1px solid #E5E5E5;z-index:30}
.input-wrap{display:flex;gap:8px;align-items:center}
.input-box{flex:1;display:flex;align-items:center;background:#fff;border-radius:24px;padding:4px 6px 4px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
#user
