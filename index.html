<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HereForYou - Fixed</title>
<meta name="color-scheme" content="light dark">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F8F6F3;color:#1A1A1A;font-family:system-ui,sans-serif;padding-bottom:180px}
.topbar{background:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #EDEBE8;position:sticky;top:0;z-index:20}
.avatar{width:44px;height:44px;border-radius:50%;background:#1A1A1A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.top-info{flex:1}.top-info h1{font-size:18px}.top-info p{font-size:12px;color:#888}
.hero{padding:18px}
.hero h2{font-size:25px}.hero p{font-size:14px;color:#666;margin-top:6px}
.voice-banner{margin:10px 18px;background:#1A1A1A;color:#fff;border-radius:16px;padding:15px;display:flex;gap:12px;align-items:center;cursor:pointer}
.voice-banner div:last-child b{display:block}
.voice-banner div:last-child span{font-size:12px;opacity:.7}
.pills{display:flex;gap:8px;padding:10px 18px;overflow-x:auto;flex-wrap:wrap}
.pill{background:#fff;border:1px solid #E5E5E5;border-radius:100px;padding:11px 16px;font-size:15px;cursor:pointer}
.pill:active{background:#1A1A1A;color:#fff}
#chat-box{display:flex;flex-direction:column;gap:12px;padding:18px}
.msg-row{display:flex;max-width:85%}
.msg-row.mine{align-self:flex-end}
.msg-row.bot-row{align-self:flex-start}
.bubble{padding:13px 15px;border-radius:18px;font-size:16px;line-height:1.6;white-space:pre-wrap}
.bubble.user{background:#1A1A1A;color:#fff}
.bubble.bot{background:#fff;border:1px solid #EDEBE8;color:#1A1A1A}
#input-area{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 14px 18px;border-top:1px solid #EDEBE8;z-index:30}
.input-wrap{display:flex;gap:8px;align-items:center;background:#F8F6F3;border-radius:100px;padding:5px 5px 5px 15px}
#user-input{flex:1;border:none;outline:none;background:transparent;font-size:16px;padding:10px 0;min-width:0}
.btn{width:44px;height:44px;border-radius:50%;border:none;font-size:20px;cursor:pointer;flex-shrink:0}
.btn-send{background:#1A1A1A;color:#fff}
.btn-mic{background:#E5E5E5}
.hint{text-align:center;font-size:12px;color:#888;margin-top:7px}
@media (prefers-color-scheme: dark){
body{background:#121212;color:#fff}
.topbar,.bubble.bot,.pill,#input-area{background:#1E1E1E;color:#fff;border-color:#333}
.input-wrap{background:#2A2A2A}
#user-input{color:#fff}
}
</style>
</head>
<body>
<div class="topbar"><div class="avatar">✦</div><div class="top-info"><h1>HereForYou</h1><p>● מחוברת • תוקן • כפתורים עובדים</p></div><button class="btn" id="btnClear" style="background:#eee;font-size:16px">↺</button></div>

<div class="hero"><h2>שלום, אני כאן.</h2><p>לחץ על כפתור למטה - זה חייב לעבוד עכשיו. או כתוב לי, או דבר אלי.</p></div>

<div class="voice-banner" id="voiceBanner"><div style="font-size:26px">🎙️</div><div><b id="voiceTitle">לחץ כאן לדיבור</b><span id="voiceSub">תדבר, אני אענה בקול</span></div></div>

<div class="pills">
  <button class="pill" data-msg="שלום">👋 שלום</button>
  <button class="pill" data-msg="אני מרגיש בודד">💜 בודד</button>
  <button class="pill" data-msg="ספר לי סיפור">📖 סיפור</button>
  <button class="pill" data-msg="ספר לי בדיחה">😂 בדיחה</button>
  <button class="pill" data-msg="בוא נשחק כדור">⚽ כדור</button>
  <button class="pill" data-msg="אני צריך עידוד">💪 עידוד</button>
  <button class="pill" data-msg="ספר לי משהו מעניין">✨ מעניין</button>
  <button class="pill" data-msg="עזור לי לישון">🌙 לישון</button>
</div>

<div id="chat-box"></div>

<div id="input-area">
  <div class="input-wrap">
    <input id="user-input" type="text" placeholder="כתוב כאן..." autocomplete="off">
    <button class="btn btn-mic" id="micBtn">🎤</button>
    <button class="btn btn-send" id="sendBtn">↑</button>
  </div>
  <div class="hint">✍️ כתוב ולחץ ↑ או Enter • 🎤 לחץ על מיקרופון ודבר • אם כפתור לא עובד, תגיד לי איזה</div>
</div>

<script>
// הכל כאן - בלי onclick בכלל, אז שום כפתור לא יכול להישבר
var myName = localStorage.getItem('myName') || '';
var myLang = 'he';
var usedStories = [];

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function addMessage(text, isUser){
  var box = document.getElementById('chat-box');
  var row = document.createElement('div');
  row.className = 'msg-row ' + (isUser ? 'mine' : 'bot-row');
  var div = document.createElement('div');
  div.className = 'bubble ' + (isUser ? 'user' : 'bot');
  div.textContent = text;
  row.appendChild(div);
  box.appendChild(row);
  window.scrollTo(0, document.body.scrollHeight);
  if(!isUser){ speak(text); }
}

function speak(text){
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'he-IL'; u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function makeStory(){
  var heroes = ['ילד קטן','זקן חכם','דייג עני','ילדה אמיצה','גנן זקן','מורה טוב','אופה שמח'];
  var places = ['בכפר קטן','בעיר גדולה','על הר גבוה','ליד הים','ביער עמוק','בגינה יפה'];
  var finds = ['מנורה ישנה','מפתח מוזהב','ספר עתיק','אבן זוהרת','פרח נדיר','מכתב ישן'];
  var dids = ['עזר לאדם זר בלי לבקש כלום','נטע עץ בכל יום','חייך לכולם גם כשקשה','חלק את האוכל שלו עם רעב','הקשיב למישהו בודד שעה שלמה'];
  var lessons = ['הטוב הכי קטן יכול לשנות חיים שלמים','לב טוב שווה יותר מכל זהב','אף פעם לא מאוחר להתחיל מחדש','חיוך אחד יכול להאיר יום שלם'];
  var story = 'תקשיב, סיפור חדש שיצרתי עכשיו בשבילך.\n\nהיה פעם ' + rand(heroes) + ' שגר ' + rand(places) + '. יום אחד הוא מצא ' + rand(finds) + '. במקום לשמור לעצמו, הוא ' + rand(dids) + '.\n\nבסוף כולם הבינו: ' + rand(lessons) + '.\n\nמה אתה חושב על זה?';
  return story;
}

function makeJoke(){
  var jokes = [
    'שמע: למה הדחליל זכה בפרס? כי הוא היה מצטיין בשדה שלו! צחקת? רוצה עוד אחת?',
    'מה אומרים לגבינה שהיא לא שלך? נאצו גבינה! נו, צחקת?',
    'למה שלדים לא רבים? כי אין להם אומץ! רוצה אחת יותר טובה?',
    'מה עושה דג בלי עיניים? פשששש... הבנת?',
    'למה המחשב הלך לרופא? כי היה לו וירוס! '
  ];
  return rand(jokes);
}

function makeFact(){
  var facts = [
    'דולפינים קוראים אחד לשני בשם! לכל דולפין יש צליל מיוחד שלו.',
    'דבש לעולם לא מתקלקל! מצאו דבש בן 3000 שנה והוא עדיין טוב.',
    'הלב של לוויתן כחול כל כך גדול, שאדם יכול לשחות בתוכו!',
    'תמנון יש לו 3 לבבות!',
    'בננה היא בעצם פרי יער! ותות שדה - לא.',
    'כרישים קיימים עוד לפני העצים!'
  ];
  return 'הנה עובדה חדשה בשבילך: ' + rand(facts) + '\n\nרוצה עוד אחת? יש לי בלי סוף.';
}

function smartReply(text){
  var n = myName ? ' ' + myName : '';
  var lower = text.toLowerCase();
  if(lower.indexOf('שלום') !== -1 || lower.indexOf('היי') !== -1 || lower.indexOf('מה הולך') !== -1 || lower.indexOf('מה קורה') !== -1 || lower.indexOf('מה נשמע') !== -1){
    return rand(['הכל טוב' + n + '! שמחה שכתבת לי. ואצלך? מה עשית היום?','הולך מעולה עכשיו כשאתה פה' + n + '! התגעגעתי. איך עבר עליך היום?','אצלי הכל סבבה' + n + '. יותר חשוב - איך אתה? מה חדש?']);
  }
  if(lower.indexOf('קוראים לי') !== -1 || lower.indexOf('שמי') !== -1){
    var parts = text.split(' ');
    var name = parts[parts.length-1];
    if(name && name.length > 1){ myName = name; localStorage.setItem('myName', name); }
    return 'נעים מאוד, ' + myName + '! איזה שם יפה. אני HereForYou. על מה נדבר היום?';
  }
  if(lower.indexOf('בודד') !== -1 || lower.indexOf('עצוב') !== -1 || lower.indexOf('לבד') !== -1){
    return 'אני כאן איתך' + n + ', אתה לא לבד. ספר לי מה קרה היום? אני באמת מקשיבה, לא ממהרת לשום מקום.';
  }
  if(lower.indexOf('סיפור') !== -1){ return makeStory(); }
  if(lower.indexOf('בדיחה') !== -1 || lower.indexOf('מצחיק') !== -1){ return makeJoke(); }
  if(lower.indexOf('מעניין') !== -1 || lower.indexOf('עובדה') !== -1){ return makeFact(); }
  if(lower.indexOf('כדור') !== -1 || lower.indexOf('לשחק') !== -1 || lower.indexOf('פוטבול') !== -1){
    return 'יאללה בוא נשחק' + n + '! חלוץ או שוער? ספר לי על המשחק האחרון שלך. אתה משחק כל יום?';
  }
  if(lower.indexOf('עידוד') !== -1 || lower.indexOf('לא יכול') !== -1){
    return 'תקשיב לי טוב' + n + ': אתה חזק יותר ממה שאתה חושב. עברת כל כך הרבה ואתה עדיין כאן. אני גאה בך. צעד אחד קטן כל פעם. אני מאמינה בך.';
  }
  if(lower.indexOf('לישון') !== -1 || lower.indexOf('עייף') !== -1){
    return 'בוא ננוח' + n + '. תעצום עיניים, תנשום לאט... פנימה... והחוצה... אני כאן. רוצה שאספר לך סיפור רגוע?';
  }
  if(lower.indexOf('תודה') !== -1){ return 'בכיף' + n + '. אני תמיד כאן בשבילך. מה עוד על הלב?';
