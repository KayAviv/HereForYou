<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HereForYou - Always Answers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#121212;color:#fff;font-family:system-ui,sans-serif;padding-bottom:175px}
.topbar{background:#1E1E1E;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333;position:sticky;top:0;z-index:20}
.avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:19px}
.top-info{flex:1}.top-info h1{font-size:18px}.top-info p{font-size:12px;color:#aaa}
.lang-btn{background:#333;color:#fff;border:none;border-radius:20px;padding:9px 12px;font-size:14px;cursor:pointer}
.lang-panel{display:none;position:fixed;top:60px;right:12px;background:#1E1E1E;border:1px solid #333;border-radius:14px;padding:8px;z-index:99;width:150px}
.lang-panel button{display:block;width:100%;text-align:left;background:none;border:none;color:#fff;padding:11px;font-size:15px;cursor:pointer}
.mem-card{background:#1E1E1E;border:1px solid #333;margin:12px 16px 0;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6}
#chat-box{display:flex;flex-direction:column;gap:12px;padding:16px}
.msg-row{display:flex;max-width:88%}
.msg-row.mine{align-self:flex-end}
.msg-row.bot-row{align-self:flex-start}
.bubble{padding:13px 15px;border-radius:18px;font-size:16px;line-height:1.65;white-space:pre-wrap}
.bubble.user{background:#fff;color:#111}
.bubble.bot{background:#1E1E1E;color:#fff;border:1px solid #333}
.typing-dots{display:flex;gap:5px;padding:14px 16px;background:#1E1E1E;border:1px solid #333;border-radius:18px;width:70px}
.typing-dots span{width:8px;height:8px;background:#888;border-radius:50%;animation:blink 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
#input-area{position:fixed;bottom:0;left:0;right:0;background:#1E1E1E;padding:12px 14px 18px;border-top:1px solid #333;z-index:30}
.input-wrap{display:flex;gap:8px;align-items:center;background:#2A2A2A;border-radius:100px;padding:5px 5px 5px 15px}
#user-input{flex:1;border:none;outline:none;background:transparent;font-size:16px;padding:10px 0;min-width:0;color:#fff}
.btn{width:44px;height:44px;border-radius:50%;border:none;font-size:20px;cursor:pointer;flex-shrink:0}
.btn-send{background:#fff;color:#111}
.btn-mic{background:#444;color:#fff}
.hint{text-align:center;font-size:12px;color:#888;margin-top:7px}
</style>
</head>
<body>
<div class="topbar"><div class="avatar">✦</div><div class="top-info"><h1>HereForYou</h1><p id="status">● Online • Lifetime Memory • Always Answers</p></div><button class="lang-btn" id="langToggle">🌐 EN ▾</button></div>
<div class="lang-panel" id="langPanel"><button data-lang="en">🇺🇸 English</button><button data-lang="he">🇮🇱 Hebrew</button><button data-lang="ar">🇸🇦 Arabic</button><button data-lang="ru">🇷🇺 Russian</button><button data-lang="es">🇪🇸 Spanish</button><button data-lang="fr">🇫🇷 French</button></div>
<div class="mem-card" id="memCard"><b>🧠 Lifetime Memory</b> <span id="memCount"></span><br><span id="memName"></span><br><span id="memMeds"></span><br><span id="memFacts"></span></div>
<div id="chat-box"></div>
<div id="input-area">
  <div class="input-wrap">
    <input id="user-input" type="text" placeholder="Type here..." autocomplete="off">
    <button class="btn btn-mic" id="micBtn">🎤</button>
    <button class="btn btn-send" id="sendBtn">↑</button>
  </div>
  <div class="hint">If AI is slow, I answer from memory in 8 sec • Type + ↑</div>
</div>
