<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HereForYou</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="avatar">✦</div>
  <div class="top-info">
    <h1>HereForYou</h1>
    <p id="status">● Online • Unlimited Brain • Lifetime Memory</p>
  </div>
  <button class="lang-btn" id="langToggle">🌐 EN ▾</button>
</div>

<div class="lang-panel" id="langPanel">
  <button data-lang="en">🇺🇸 English</button>
  <button data-lang="he">🇮🇱 Hebrew</button>
  <button data-lang="ar">🇸🇦 Arabic</button>
  <button data-lang="ru">🇷🇺 Russian</button>
  <button data-lang="es">🇪🇸 Spanish</button>
  <button data-lang="fr">🇫🇷 French</button>
</div>

<div class="mem-card">
  <b>🧠 Lifetime Memory</b> <span id="memCount"></span><br>
  <span id="memName">Name: -</span><br>
  <span id="memMeds">💊 Medicines: -</span><br>
  <span id="memFacts">💛 Facts: -</span>
</div>

<div id="chat-box"></div>

<div id="input-area">
  <div class="input-wrap">
    <input id="user-input" type="text" placeholder="Type here..." autocomplete="off">
    <button class="btn btn-mic" id="micBtn" title="Talk">🎤</button>
    <button class="btn btn-send" id="sendBtn" title="Send">↑</button>
  </div>
  <div class="hint">Type + ↑ to send • 🎤 to talk • 🌐 top right for language</div>
</div>

<script src="app.js"></script>
</body>
</html>
