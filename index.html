<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HereForYou</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#F8F6F3;padding:20px;padding-bottom:220px}
.topbar{background:#fff;padding:14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #E5E5E5;position:sticky;top:0;z-index:20}
.avatar{width:42px;height:42px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center}
.top-info{flex:1}.top-info h1{font-size:18px}.top-info p{font-size:12px;color:#888}
.lang-btn{background:#eee;border:none;border-radius:20px;padding:9px 12px;font-size:14px;cursor:pointer}
.lang-panel{display:none;position:fixed;top:60px;right:12px;background:#fff;border:1px solid #ddd;border-radius:14px;padding:8px;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.2);width:150px}
.lang-panel button{display:block;width:100%;text-align:left;background:none;border:none;padding:11px;font-size:15px;cursor:pointer}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0}
.pill{background:#fff;border:1px solid #E5E5E5;border-radius:100px;padding:11px 16px;font-size:15px;cursor:pointer}
#chat-box{display:flex;flex-direction:column;gap:10px}
.msg{background:#fff;padding:12px 14px;border-radius:14px;font-size:16px;max-width:85%;border:1px solid #EDEBE8}
.msg.mine{background:#111;color:#fff;align-self:flex-end}
#debug{background:#FFF3CD;padding:10px;border-radius:10px;font-size:13px;margin:10px 0}
#input-area{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 14px 18px;border-top:1px solid #ddd;z-index:30}
#user-input{width:100%;border:2px solid #111;border-radius:14px;font-size:18px;padding:14px;outline:none;background:#fff}
#bigSend{width:100%;background:#111;color:#fff;border:none;border-radius:14px;padding:16px;font-size:19px;font-weight:800;margin-top:10px;cursor:pointer}
#bigSend:active{background:#333;transform:scale(0.98)}
#micBig{width:100%;background:#E5E5E5;border:none;border-radius:14px;padding:12px;font-size:16px;margin-top:8px;cursor:pointer}
</style>
</head>
<body>
<div class="topbar"><div class="avatar">✦</div><div class="top-info"><h1>HereForYou</h1><p id="status">● Online • English • FIXED TEXT</p></div><button class="lang-btn" id="langToggle">🌐 EN ▾</button></div>
<div class="lang-panel" id="langPanel"><button data-lang="en">🇺🇸 English</button><button data-lang="he">🇮🇱 Hebrew</button><button data-lang="ar">🇸🇦 Arabic</button><button data-lang="ru">🇷🇺 Russian</button><button data-lang="es">🇪🇸 Spanish</button><button data-lang="fr">🇫🇷 French</button></div>

<h2 style="margin-top:14px">Hello, I'm here.</h2>
<p style="color:#666;font-size:14px;margin-top:6px">Type below and tap the BIG black SEND button. It is separate, it cannot be blocked.</p>
<div id="debug">DEBUG: Page loaded OK. Now type something.</div>

<div class="pills">
  <button class="pill" data-msg="Hello">👋 Hello</button>
  <button class="pill" data-msg="I feel lonely">💜 Lonely</button>
  <button class="pill" data-msg="Tell me a story">📖 Story</button>
  <button class="pill" data-msg="Tell me a joke">😂 Joke</button>
</div>
<div id="chat-box"></div>

<div id="input-area">
  <input id="user-input" type="text" placeholder="Type hello here..." autocomplete="off">
  <button id="bigSend">SEND ➤ TAP HERE</button>
  <button id="micBig">🎤 Or tap to talk</button>
</div>

<script>
var input = document.getElementById('user-input');
var debug = document.getElementById('debug');
var box = document.getElementById('chat-box');
var lang = 'en';
var myName = '';

function setDebug(t){ debug.textContent = 'DEBUG: ' + t; }
function addMsg(text, mine){
  var d = document.createElement('div');
  d.className = 'msg ' + (mine ? 'mine' : '');
  d.textContent = text;
  box.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  if(!mine){ try{ var u = new SpeechSynthesisUtterance(text); u.lang = lang === 'he' ? 'he-IL' : 'en-US'; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }catch(e){} }
}
function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
function reply(text){
  var n = myName ? ' ' + myName : '';
  var l = text.toLowerCase();
  if(l.indexOf('my name is') !== -1){ var p = text.split(' '); myName = p[p.length-1]; return 'Nice to meet you, ' + myName + '! How are you feeling today?'; }
  if(l.indexOf('hello') !== -1 || l.indexOf('hi') !== -1){ return 'Hello' + n + '! I am so happy you came. How are you feeling?'; }
  if(l.indexOf('lonely') !== -1 || l.indexOf('sad') !== -1){ return 'I am here with you' + n + ', you are not alone. Tell me what happened today? I am really listening.'; }
  if(l.indexOf('story') !== -1){ return 'Listen' + n + ', a new story: Once there was ' + rand(['a little boy','a wise old man','a brave girl']) + ' who lived ' + rand(['in a small village','near the sea','in a deep forest']) + '. He found a golden key and helped a stranger. In the end everyone understood: kindness changes everything. What do you think?'; }
  if(l.indexOf('joke') !== -1){ return rand(['Why did the scarecrow win an award? Because he was outstanding in his field!','What do you call cheese that is not yours? Nacho cheese!']); }
  var w = text.split(' '); var kw = w[w.length-1] || 'that';
  return 'Oh really' + n + '? You said "' + kw + '" - tell me more, I want to hear everything. What happened next?';
}
function doSend(){
  var t = input.value.trim();
  setDebug('BIG SEND PRESSED! Text = [' + t + ']');
  if(!t){ alert('Type something first!'); return; }
  addMsg(t, true);
  input.value = '';
  setTimeout(function(){ addMsg(reply(t), false); }, 400);
}
// 3 דרכים שונות לוודא שהלחיצה עוב
