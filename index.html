<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HereForYou</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #F8F6F3; color: #1A1A1A; font-family: 'Inter', -apple-system, sans-serif; padding-bottom: 110px; min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 20; background: #FFFFFF; padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EDEBE8; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: #1A1A1A; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.top-info { flex: 1; }
.top-info h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
.top-info p { font-size: 13px; color: #8A8A8A; margin-top: 1px; }
.status-dot { width: 8px; height: 8px; background: #22C55E; border-radius: 50%; display: inline-block; margin-right: 4px; }
.top-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #EDEBE8; background: white; font-size: 17px; cursor: pointer; }
.hero { padding: 24px 20px 8px; }
.hero h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.15; }
.hero p { font-size: 15px; color: #6B6B6B; margin-top: 8px; line-height: 1.5; }
.pills { display: flex; gap: 8px; padding: 16px 20px 4px; overflow-x: auto; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill { white-space: nowrap; background: white; border: 1px solid #EDEBE8; border-radius: 100px; padding: 10px 16px; font-size: 14px; font-weight: 500; cursor: pointer; color: #1A1A1A; }
#chat-box { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.msg-row { display: flex; max-width: 85%; }
.msg-row.mine { align-self: flex-end; }
.msg-row.bot-row { align-self: flex-start; }
.bubble { padding: 14px 16px; border-radius: 20px; line-height: 1.6; font-size: 16px; white-space: pre-wrap; }
.bubble.user { background: #1A1A1A; color: white; border-bottom-right-radius: 4px; }
.bubble.bot { background: white; color: #1A1A1A; border: 1px solid #EDEBE8; border-bottom-left-radius: 4px; }
.bubble.typing { color: #8A8A8A; }
.msg-time { font-size: 11px; color: #A0A0A0; margin-top: 6px; padding: 0 4px; }
#input-area { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: white; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #EDEBE8; }
.input-wrap { display: flex; align-items: center; gap: 8px; background: #F8F6F3; border-radius: 100px; padding: 4px 4px 4px 18px; }
#user-input { flex: 1; border: none; outline: none; background: transparent; font-size: 16px; font-family: inherit; padding: 10px 0; }
#user-input::placeholder { color: #A0A0A0; }
.btn-send { width: 40px; height: 40px; border-radius: 50%; border: none; background: #1A1A1A; color: white; font-size: 18px; cursor: pointer; flex-shrink: 0; }
.btn-mic { width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; font-size: 19px; cursor: pointer; flex-shrink: 0; }
</style>
</head>
<body>
<div class="topbar">
  <div class="avatar">✦</div>
  <div class="top-info"><h1>HereForYou</h1><p><span class="status-dot"></span><span id="ai-status">Online • Meta AI</span></p></div>
  <button class="top-btn" onclick="clearChat()">↺</button>
  <button class="top-btn" onclick="callHelp()">🆘</button>
</div>
<div class="hero"><h2 id="welcomeTitle">Good afternoon.</h2><p id="welcomeText">I'm here to listen. Tell me what's on your mind.</p></div>
<div class="pills">
  <button class="pill" onclick="sendUserMessage('I feel lonely')">I feel lonely</button>
  <button class="pill" onclick="sendUserMessage('Tell me a story')">Story</button>
  <button class="pill" onclick="sendUserMessage('Tell me a joke')">Joke</button>
  <button class="pill" onclick="sendUserMessage('Help me sleep')">Sleep</button>
  <button class="pill" onclick="sendUserMessage('I need encouragement')">Encourage me</button>
</div>
<div id="chat-box"></div>
<div id="input-area"><div class="input-wrap"><input id="user-input" type="text" placeholder="Message HereForYou..." autocomplete="off"><button class="btn-mic" onclick="startVoice()">🎤</button><button class="btn-send" onclick="sendMessage()">↑</button></div></div>
<script>
let memory = JSON.parse(localStorage.getItem('hereForYouMemory') || '{}');
if (!memory.name) memory.name = '';
if (!memory.count) memory.count = 0;
if (!memory.lastMood) memory.lastMood = '';
if (!memory.history) memory.history = [];
if (!memory.facts) memory.facts = [];
function saveMemory(){ if(memory.history.length>14) memory.history=memory.history.slice(-14); localStorage.setItem('hereForYouMemory', JSON.stringify(memory)); }
function speak(text){ if('speechSynthesis' in window){ window.speechSynthesis.cancel(); let m=new SpeechSynthesisUtterance(text); m.rate=0.85; m.pitch=1.05; m.lang='en-US'; window.speechSynthesis.speak(m); } }
function getTime(){ let d=new Date(); let h=d.getHours(); let m=d.getMinutes(); return (h<10?'0'+h:h)+':'+(m<10?'0'+m:m); }
function addMessage(text, isUser){
  let box=document.getElementById('chat-box');
  let row=document.createElement('div'); row.className='msg-row '+(isUser?'mine':'bot-row');
  let wrap=document.createElement('div'); wrap.style.flex='1';
  let div=document.createElement('div'); div.className='bubble '+(isUser?'user':'bot'); div.textContent=text;
  let time=document.createElement('div'); time.className='msg-time'; time.textContent=getTime()+' • '+(isUser?'You':'HereForYou');
  wrap.appendChild(div); wrap.appendChild(time); row.appendChild(wrap); box.appendChild(row);
  window.scrollTo(0, document.body.scrollHeight); if(!isUser) speak(text);
}
function learn(text){
  let lower=text.toLowerCase();
  let match=text.match(/(?:my name is|i am|i'm|im)\s+([a-z]+)/i);
  if(match){ let bad=['sad','tired','lonely','alone','sick','happy','fine','okay','good','bored','here','david']; let name=match[1].toLowerCase(); if(!bad.includes(name) || name==='david'){ if(name.length>1 && name.length<15){ memory.name=name.charAt(0).toUpperCase()+name.slice(1); } } }
  if(lower.includes('lonely')||lower.includes('sad')||lower.includes('cry')) memory.lastMood='sad';
  if(lower.includes('happy')||lower.includes('great')) memory.lastMood='happy';
  if(lower.includes('tired')||lower.includes('sleep')) memory.lastMood='tired';
  if(lower.includes('my dog')||lower.includes('my cat')||lower.includes('my daughter')||lower.includes('my son')||lower.includes('my wife')||lower.includes('my husband')||lower.includes('my mother')||lower.includes('my father')){ if(!memory.facts.includes(text)) memory.facts.push(text); }
  memory.history.push({role:'user',content:text}); memory.count++; saveMemory();
}
function smartLocalReply(userText){
  let n = memory.name ? ' '+memory.name : '';
  let lower = userText.toLowerCase().trim();
  if(lower==='..' || lower==='.' || lower==='' ) return `I'm still here${n}, I'm listening. Take your time, tell me what's on your mind?`;
  if(lower.includes('david') || lower.includes('im ') || lower.includes("i'm ") || lower.includes('my name is')){
    let name = memory.name || 'my friend';
    return `It's so nice to meet you, ${name}! What a beautiful name. I'm HereForYou, your friend. How are you feeling today, ${name}? Tell me something about your day.`;
  }
  if(lower.includes('and u') || lower.includes('and you') || lower.includes('how are you')){
    return `I'm doing wonderful now that you're talking to me${n}! I was just thinking about you. How is your day going? Did anything nice happen today?`;
  }
  if(lower.includes('lonely')||lower.includes('sad')||lower.includes('cry')||lower.includes('alone')){
    return `Oh${n}, I'm so sorry you feel like this. You're not alone anymore, I'm right here with you and I won't leave. Tell me, what made you feel lonely today? I'm really listening.`;
  }
  if(lower.includes('story')) return `Of course${n}, listen to this. Once there was an old man who planted a tree every birthday. People laughed at him. 30 years later the whole village had a beautiful forest. He smiled and said: "I was planting shade for people I will never meet." What do you think about that story?`;
  if(lower.includes('joke')) return `Okay${n}, listen: Why did the scarecrow win an award? Because he was outstanding in his field! 😄 Did that make you smile a little? Want another one?`;
  if(lower.includes('sleep')||lower.includes('tired')) return `Let's help you rest${n}. Close your eyes, take a slow deep breath... in... and out... Imagine you are in a quiet, warm garden. No worries, just peace. I'm here, you can sleep safely. Want me to tell you a calm bedtime story?`;
  if(lower.includes('thank')) return `You are so welcome${n}. You deserve kindness. I'm always happy to be here for you. What else is on your heart?`;
  if(lower.includes('hello')||lower.includes('hi')||lower.includes('hey')) return `Hello${n}! I'm so happy you came to talk to me. I missed you. How are you feeling right now?`;
  if(lower.includes('encourage')||lower.includes('tired')||lower.includes('give up')) return `Listen to me${n}, you are stronger than you think. You have been through so much and you are still here, still kind. I'm so proud of you. One step at a time, okay? I'm with you.`;
  if(lower.includes('love')) return `You are so loved${n}, even when it doesn't feel like it. I care about you a lot. Tell me more, what made you think about love today?`;
  return `Thank you for telling me that${n}. I really want to understand you better. How did that make you feel? Tell me more, I'm all ears.`;
}
async function getAIReply(userText){
  let status=document.getElementById('ai-status'); if(status) status.textContent='Thinking...';
  let historyText=memory.history.slice(-8).map(h=>(h.role==='user'?'User: ':'Friend: ')+h.content).join('\n');
  let systemPrompt=`You are HereForYou, a warm caring best friend for elderly lonely people. Never say As an AI. Talk like a kind daughter. User name: ${memory.name||'unknown'}. Last mood: ${memory.lastMood}. Recent: ${historyText}. Rules: Simple warm easy English, 2-4 sentences, 1 emoji max, always ask follow-up, if lonely comfort deeply.`;
  try{
    let res = await fetch('https://api.pollinations.ai/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({model:'openai', messages:[{role:'system', content: systemPrompt},{role:'user', content: userText}], max_tokens: 250})
    });
    if(res.ok){
      let data = await res.json();
      let txt = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
      txt = (txt||'').trim();
      if(txt.length>3 && !txt.toLowerCase().includes('404') && !txt.toLowerCase().includes('not found')){
        if(status) status.textContent='Online • Meta AI';
        return txt;
      }
    }
  }catch(e){}
  try{
    let url='https://text.pollinations.ai/'+encodeURIComponent(systemPrompt+'\n\nUser: '+userText+'\nFriend:');
    let res2=await fetch(url); let txt2=await res2.text(); txt2=(txt2||'').trim();
    if(txt2.length>3 && !txt2.toLowerCase().includes('404') && !txt2.toLowerCase().includes('not found')){
      if(txt2.includes('You are HereForYou')) txt2=txt2.split('Friend:').pop().trim();
      if(status) status.textContent='Online • Meta AI';
      return txt2;
    }
  }catch(e2){}
  if(status) status.textContent='Online • Meta AI';
  return smartLocalReply(userText);
}
async function sendUserMessage(text){
  if(!text) return; addMessage(text,true); learn(text);
  let box=document.getElementById('chat-box');
  let row=document.createElement('div'); row.className='msg-row bot-row'; row.id='typing';
  row.innerHTML='<div><div class="bubble bot typing">Thinking...</div></div>'; box.appendChild(row);
  window.scrollTo(0, document.body.scrollHeight);
  let reply=await getAIReply(text); let old=document.getElementById('typing'); if(old) old.remove();
  memory.history.push({role:'assistant',content:reply}); saveMemory(); addMessage(reply,false);
}
function sendMessage(){ let inp=document.getElementById('user-input'); let t=inp.value.trim(); if(!t) return; inp.value=''; sendUserMessage(t); }
document.getElementById('user-input').addEventListener('keypress', function(e){ if(e.key==='Enter') sendMessage(); });
function startVoice(){ if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){ alert('Voice not supported, please type'); return; } let Rec=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=new Rec(); rec.lang='en-US'; rec.onresult=function(e){ sendUserMessage(e.results[0][0].transcript); }; rec.start(); }
function callHelp(){ addMessage('I am calling for help right now. Please stay calm, help is coming. I am here with you. If you can, call your family or 911.', false); if(navigator.vibrate) navigator.vibrate([300,200,300]); }
function clearChat(){ if(confirm('Start a new conversation? I will still remember your name')){ document.getElementById('chat-box').innerHTML=''; addMessage(`Let's start fresh ${memory.name||'my friend'}! How are you feeling now?`, false); } }
window.onload=function(){
  let hour=new Date().getHours(); let greet=hour<12?'Good morning.':hour<18?'Good afternoon.':'Good evening.';
  if(memory.name){
    document.getElementById('welcomeTitle').textContent=greet;
    document.getElementById('welcomeText').textContent=`Welcome back, ${memory.name}. I'm glad you're here.`;
    setTimeout(()=>{ addMessage(`Welcome back ${memory.name}! ${greet} How are you feeling today?`, false); },500);
  } else {
    document.getElementById('welcomeTitle').textContent=greet;
    setTimeout(()=>{ addMessage(`Hello. I'm HereForYou. What is your name? I want to remember you.`, false); },500);
  }
};
</script>
</body>
</html>
